version: '3'

services:
    # Apache and PHP service
    web:
        image: php:8.2-apache
        container_name: lamp_web
        ports:
            - "80:80"
        volumes:
            - ./www:/var/www/html
        depends_on:
            - db
        environment:
            - MYSQL_HOST=db
            - MYSQL_USER=lamp_user
            - MYSQL_PASSWORD=lamp_password
            - MYSQL_DATABASE=lamp_db
        networks:
            - lamp_network

    # MySQL service
    db:
        image: mysql:8.0
        container_name: lamp_db
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=root_password
            - MYSQL_DATABASE=lamp_db
            - MYSQL_USER=lamp_user
            - MYSQL_PASSWORD=lamp_password
        networks:
            - lamp_network

    # phpMyAdmin service
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: lamp_phpmyadmin
        ports:
            - "8080:80"
        environment:
            - PMA_HOST=db
            - PMA_PORT=3306
        depends_on:
            - db
        networks:
            - lamp_network

networks:
    lamp_network:
        driver: bridge

volumes:
    mysql_data: