<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      :root {
        --primary-color: #0f243a;
        --secondary-color: #2563eb;
      }
      .bg-primary {
        background-color: var(--primary-color);
      }
      .text-primary {
        color: var(--primary-color);
      }
      .hover-effect:hover {
        transform: translateY(-2px);
        transition: all 0.3s ease;
      }
      .nav-link {
        position: relative;
      }
      .nav-link::after {
        content: "";
        position: absolute;
        width: 0;
        height: 2px;
        bottom: -4px;
        left: 0;
        background-color: var(--secondary-color);
        transition: width 0.3s ease;
      }
      .nav-link:hover::after {
        width: 100%;
      }
      .active::after {
        width: 100%;
      }
    </style>
    <title>Dock Pilot | Lab</title>
</head>
<body>
    <header class="bg-white shadow-md">
        <div class="container mx-auto px-4">
          <div class="flex justify-between items-center py-4">
            <!-- Logo Section -->
            <div class="flex items-center space-x-2 hover-effect">
              <a href="/">
                <img src="/dockpilot-logo.png" alt="Logo" class="w-40 h-auto" />
              </a>
            </div>
    
            <!-- Navigation -->
            <nav class="hidden md:flex space-x-8">
              <a href="/" class="nav-link text-primary font-medium"
                >Dashboard</a
              >
              <a href="/containers" class="nav-link text-primary font-medium">Containers</a>
              <a href="/images" class="nav-link text-primary font-medium">Images</a>
              <a href="/lab" class="nav-link active text-primary font-medium"
                >Container Lab</a
              >
            </nav>
    
            <!-- Right Side Icons -->
            <div class="flex items-center space-x-4">
              <button
                class="hover-effect flex items-center justify-center w-10 h-10 rounded-full bg-blue-100 text-blue-600"
              >
                <i class="fas fa-circle-info"></i>
              </button>
              <button class="md:hidden text-primary">
                <i class="fas fa-bars text-xl"></i>
              </button>
            </div>
          </div>
        </div>
    
        <!-- Mobile Menu (Hidden by default) -->
        <div class="hidden md:hidden bg-white pb-4 px-4">
          <a href="#" class="block py-2 text-primary font-medium">Dashboard</a>
          <a href="#" class="block py-2 text-primary font-medium">Containers</a>
          <a href="#" class="block py-2 text-primary font-medium">Images</a>
          <a href="#" class="block py-2 text-primary font-medium"
            >Container Lab</a
          >
        </div>
      </header>
</body>
</html>
